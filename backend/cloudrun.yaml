# GCP Cloud Run サービス設定
# 課金を最小限に抑えるための設定

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: meshscope-api
  annotations:
    # リージョン: 東京（asia-northeast1）または最も近いリージョン
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # 最小インスタンス数: 0（使用されていない時は完全に停止して課金ゼロ）
        autoscaling.knative.dev/minScale: '0'
        # 最大インスタンス数: 1（無料枠を超えないよう制限）
        autoscaling.knative.dev/maxScale: '1'
        # CPUスロットリング: リクエスト処理時のみCPU使用（課金節約）
        run.googleapis.com/cpu-throttling: 'true'
        # 起動時間のタイムアウト（秒）
        run.googleapis.com/startup-cpu-boost: 'false'
    spec:
      # タイムアウト: 60秒（無料枠に収める）
      timeoutSeconds: 60
      containers:
      - image: REGION-docker.pkg.dev/PROJECT_ID/meshscope/api:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        # 環境変数はCloud Runコンソールまたはgcloudコマンドで設定
        - name: ESTAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: estat-api-key
              key: latest
        - name: ALLOWED_ORIGINS
          value: "https://YOUR_USERNAME.github.io"
        resources:
          limits:
            # メモリ: 256Mi（最小値、無料枠に収める）
            memory: 256Mi
            # CPU: 1（0.5-2の範囲で設定可能）
            cpu: '1'
